# OWL 本地前端联调专用；生产环境继续使用外部 PostgreSQL。
# docker compose --env-file backend/.env -f compose.local-db.yaml up -d
name: owl-frontend-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: owl-frontend-dev-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: owl-frontend-dev-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
    name: owl-frontend-dev-postgres-data
  minio_data:
    name: owl-frontend-dev-minio-data
