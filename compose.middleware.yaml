x-managed-middleware-environment: &managed-middleware-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-owl_platform}
  DB_USER: ${POSTGRES_USER:-owl}
  DB_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
  MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
  MINIO_BUCKET: ${MINIO_BUCKET:-owl-platform}

x-application-secrets: &application-secrets
  - postgres_password
  - redis_password
  - minio_access_key
  - minio_secret_key

services:
  migration:
    environment: *managed-middleware-environment
    secrets: *application-secrets
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    environment: *managed-middleware-environment
    secrets: *application-secrets
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-owl_platform}
      POSTGRES_USER: ${POSTGRES_USER:-owl}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - application

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - application

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_access_key)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_secret_key)"
        exec minio server /data --console-address ":9001"
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - application

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./deploy/secrets/postgres_password}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-./deploy/secrets/redis_password}
  minio_access_key:
    file: ${MINIO_ACCESS_KEY_SECRET_FILE:-./deploy/secrets/minio_access_key}
  minio_secret_key:
    file: ${MINIO_SECRET_KEY_SECRET_FILE:-./deploy/secrets/minio_secret_key}

volumes:
  postgres_data:
  redis_data:
  minio_data:
