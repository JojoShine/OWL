name: ${COMPOSE_PROJECT_NAME:-owl-platform}

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env}
  env_file:
    - path: ./.env
      required: true
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3001
    LOG_TO_STDOUT: "true"
  extra_hosts:
    - host.docker.internal:host-gateway
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  init: true
  networks:
    - application

services:
  migration:
    <<: *backend-common
    command: ["npm", "run", "db:deploy"]
    restart: "no"

  backend:
    <<: *backend-common
    restart: unless-stopped
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536M}
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-5002}:3001
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true


networks:
  application:
    driver: bridge

volumes:
  backend_logs:
