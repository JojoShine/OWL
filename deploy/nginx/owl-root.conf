# Example server block for an existing Nginx; configure HTTPS in your site's normal TLS setup.
# dist contents must be deployed to /srv/www/owl-current/ (or a symlink to a version directory).
server {
    listen 80;
    server_name owl.example.com;
    root /srv/www/owl-current;
    include mime.types;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api { return 308 /api/; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }
    location = /socket.io { return 308 /socket.io/; }
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
    location = /uploads { return 308 /uploads/; }
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5002/uploads/;
        proxy_set_header Host $host;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    # Missing static files must never receive the SPA HTML.
    location ~* ^/.*\.(?:js|css|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|txt|xml|pdf)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
