# 修改域名；dist 内容放到 /srv/www/owl/，5002 对应 BACKEND_PORT。
# 合并到现有 HTTPS 站点时，沿用该站点的 listen、证书和 TLS 配置。
server {
    listen 80;
    server_name owl.example.com;
    root /srv/www;
    include mime.types;

    location = /owl { return 308 /owl/; }

    location ^~ /owl/api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    location ^~ /owl/socket.io/ {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    location = /owl/index.html {
        expires -1;
    }

    location ^~ /owl/assets/ {
        try_files $uri =404;
    }

    location ~* ^/owl/.*\.(?:js|css|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|txt|xml|pdf)$ {
        try_files $uri =404;
    }

    location /owl/ { try_files $uri $uri/ /owl/index.html; }
    location / { return 404; }
}
